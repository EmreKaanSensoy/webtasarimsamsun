<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi | Web Samsun Tasarım</title>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-primary: #08090B;
            --bg-card: #101216;
            --color-primary: #FE2000;
            --color-accent: #D31F46;
            --gradient-accent: linear-gradient(135deg, #FE2000 0%, #D31F46 100%);
            --text-primary: #FFFFFF;
            --text-secondary: #8E929E;
            --border-color: rgba(255, 255, 255, 0.05);
            --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Glowing Backgrounds */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(254, 32, 0, 0.08) 0%, transparent 70%);
            top: -50px;
            right: -50px;
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(211, 31, 70, 0.06) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            z-index: 1;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            z-index: 5;
            text-align: center;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(254, 32, 0, 0.03);
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .logo-text .highlight {
            color: var(--color-primary);
        }

        .text-gradient {
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .form-input {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 16px 14px 45px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.3s, background-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--color-primary);
            background-color: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 0 4px rgba(254, 32, 0, 0.15);
        }

        .form-input:focus+.input-icon {
            color: var(--color-primary);
        }

        .login-btn {
            width: 100%;
            background: var(--gradient-accent);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s, filter 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            filter: brightness(1.1);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .back-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: var(--text-primary);
        }
    </style>
</head>

<body>

    <div class="login-container">
        <a href="index.html" class="logo-text">
            <span class="brand-main">web<span class="highlight">tasarım</span>samsun</span>
        </a>
        <p class="login-subtitle">Yönetici Giriş Kapısı</p>

        <div class="error-msg" id="errorMsg">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span id="errorText">Giriş başarısız oldu.</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">E-Posta Adresi</label>
                <div class="input-wrapper">
                    <input class="form-input" type="email" id="username" required
                        placeholder="yonetici@websamsuntasarim.com">
                    <i class="bi bi-envelope input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Şifre</label>
                <div class="input-wrapper">
                    <input class="form-input" type="password" id="password" required placeholder="••••••••">
                    <i class="bi bi-lock input-icon"></i>
                </div>
            </div>

            <button type="submit" class="login-btn">
                Giriş Yap <i class="bi bi-box-arrow-in-right"></i>
            </button>
        </form>

        <a href="index.html" class="back-home">
            <i class="bi bi-arrow-left"></i> Siteye Geri Dön
        </a>
    </div>

    <!-- Supabase SDK & Configuration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://pkvxxswogozwmduxdgtc.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrdnh4c3dvZ296d21kdXhkZ3RjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMTQ2NzksImV4cCI6MjA5OTU5MDY3OX0.h1gDqX6H9dGVUUTfhRostIwovqntWX3n5n_Ztb40IhE";

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.querySelector('.login-btn');
            const originalBtnHTML = submitBtn.innerHTML;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Giriş Yapılıyor...';
            errorMsg.style.display = 'none';

            try {
                if (!window.supabase) {
                    throw new Error("Supabase SDK yüklenemedi. İnternet bağlantınızı kontrol edin.");
                }

                if (u.toLowerCase() === 'admin@ornek.com') {
                    throw new Error("Lütfen tanımlı kendi yönetici hesabınızla giriş yapın.");
                }

                const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { data, error } = await client.auth.signInWithPassword({
                    email: u,
                    password: p
                });

                if (error) throw error;

                // Login successful, redirect to admin.html
                window.location.href = 'admin.html';
            } catch (err) {
                console.error("Giriş hatası:", err);
                errorText.textContent = err.message || "Giriş başarısız. Bilgileri kontrol edin.";
                errorMsg.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHTML;
            }
        });
    </script>
</body>

</html>
